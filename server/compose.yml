services:
  lsky-pro:
    image: halcyonazure/lsky-pro-docker@sha256:64ad14908a41c818f023233253d2303bf091bf53884fd8e4faa32e48dc74f044
    container_name: lsky-upload-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LSKY_SERVER_PORT:-8080}:8089"
    environment:
      WEB_PORT: "8089"
    volumes:
      - "${LSKY_SERVER_DATA_DIR:-${HOME}/.local/share/lsky-upload/server/data}:/var/www/html"
