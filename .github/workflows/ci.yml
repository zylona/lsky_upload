name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes ripgrep shellcheck
      - name: Shell checks
        run: mise run check-shell
      - name: Client mock tests
        run: scripts/test_client.sh
      - name: Compose validation
        run: docker compose -f server/compose.yml config --quiet
      - name: Release build
        run: scripts/build_release.sh
      - name: Release checksum
        run: |
          version="$(<VERSION)"
          (cd dist && sha256sum -c "lsky-upload-v${version}-linux.tar.gz.sha256")
      - name: Whitespace check
        run: git diff --check

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate release tag and VERSION
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(<VERSION)" == "$version" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build release assets
        run: scripts/build_release.sh "${{ steps.version.outputs.version }}"
      - name: Verify release checksum
        run: cd dist && sha256sum -c "lsky-upload-v${{ steps.version.outputs.version }}-linux.tar.gz.sha256"
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            "dist/lsky-upload-v${VERSION}-linux.tar.gz" \
            "dist/lsky-upload-v${VERSION}-linux.tar.gz.sha256" \
            --verify-tag \
            --title "lsky-upload v${VERSION}" \
            --generate-notes
